# Template — .github/workflows/terraform.yml in the <project>-prod-infra repo.
# The infra repo's Terraform CI: plan on pull requests, apply on main, AWS credentials through GitHub OIDC.
#
# Case study "AWS + Supabase + Cloudflare" (pakem: case-studies/aws-supabase-cloudflare): an illustration, not part
# of the pakem standard.
name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# GitHub OIDC → AWS role (no static credentials).
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  # Must match .terraform-version. A version bump = change both together
  # (a newer Terraform upgrades the state format; CI on the old version then rejects it).
  TF_VERSION: "1.9.5"
  WORKING_DIR: terraform
  AWS_REGION: <region>

jobs:
  plan:
    name: fmt / validate / plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      # Non-secret settings come from the committed prod.tfvars, so CI and local runs always match.
      # Only real secrets come in as TF_VAR_* from GitHub.
      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file=prod.tfvars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_typesense_api_key: ${{ secrets.TYPESENSE_API_KEY }}

  apply:
    name: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # add a required reviewer here if you want a manual gate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var-file=prod.tfvars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_typesense_api_key: ${{ secrets.TYPESENSE_API_KEY }}
